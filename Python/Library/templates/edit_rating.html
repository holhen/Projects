<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <p>Book title: {{book.title}}</p>
    <p>Current rating: {{book.rating}}</p>
    <form action="{{url_for('edit', book_id=book.id)}}" method="POST">
        <input name="rating" placeholder="Enter new rating" type="number" step="0.01"/>
        <button type="submit">Change rating</button>
    </form>
</body>
</html>
